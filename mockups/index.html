<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stride — gym tracker mockups</title>
  <style>
    :root{--bg:#f4f3ef;--paper:#fffefa;--ink:#17221d;--muted:#65716a;--line:#dfe4db;--green:#2d644b;--lime:#d8f36e;--soft:#edf3e9;--orange:#c87542;--shadow:0 18px 54px rgba(27,42,31,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a6ca37;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48} .hidden{display:none!important}
    .canvas{min-height:100vh;padding:32px 20px 80px}.intro{max-width:1040px;margin:0 auto 24px;display:flex;align-items:end;justify-content:space-between;gap:20px}.intro h1{font-size:28px;letter-spacing:-.05em;margin:0}.intro p{margin:7px 0 0;color:var(--muted);font-size:14px}.intro .badge{border:1px solid var(--line);background:var(--paper);padding:9px 13px;border-radius:30px;color:var(--muted);font-size:12px;white-space:nowrap}
    .app{width:min(100%,1040px);min-height:710px;margin:auto;background:var(--paper);border:1px solid #d9dfd6;border-radius:26px;box-shadow:var(--shadow);overflow:hidden;position:relative}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(255,254,250,.96);position:relative;z-index:2}.top-left,.top-right{display:flex;align-items:center;gap:11px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;display:grid;place-items:center;color:var(--ink);font-size:20px}.date-btn,.quiet-btn{border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 14px;font-weight:650;color:var(--ink)}.brand{font-weight:900;font-size:21px;letter-spacing:-.07em}.sync{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:700}.sync-dot{height:8px;width:8px;border-radius:50%;background:#6bb56f}.avatar{height:34px;width:34px;border-radius:50%;background:#d8eadc;display:grid;place-items:center;font-weight:800;color:var(--green);font-size:12px}
    .page{padding:30px 38px 100px;max-width:840px;margin:auto}.page-title{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--green);font-size:11px;font-weight:850;margin:0 0 8px}.page h2{font-size:32px;letter-spacing:-.06em;line-height:1.06;margin:0}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:9px 0 0}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:7px 10px;font-size:11px;font-weight:800;background:var(--soft);color:var(--green);white-space:nowrap}.pill.neutral{background:#f1f1ee;color:#68716b}.pill.warn{background:#fff1e7;color:#a95e2e}.section-label{display:flex;align-items:center;justify-content:space-between;color:#738079;font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:850;margin:25px 0 12px}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 28px}.stat{background:#eff4e9;border:1px solid #e1ead8;border-radius:18px;padding:16px}.stat strong{font-size:23px;letter-spacing:-.05em;display:block}.stat span{color:var(--muted);font-size:11px;font-weight:700}.activity{border:1px solid var(--line);border-radius:18px;margin:10px 0;background:#fff;overflow:hidden;transition:box-shadow .2s}.activity.open{border-color:#b8d4ad;box-shadow:0 8px 24px rgba(25,66,38,.07)}.activity-row{display:grid;grid-template-columns:56px 40px 1fr auto;gap:11px;align-items:center;min-height:90px;padding:13px 16px}.activity-row[role=button]{cursor:pointer}.time{font-size:12px;font-weight:800;color:var(--muted)}.cat-icon{height:38px;width:38px;background:#eff4e9;border-radius:12px;display:grid;place-items:center;font-size:19px}.activity-text strong{display:block;font-size:15px;letter-spacing:-.025em}.activity-text small{display:block;color:var(--muted);font-size:12px;margin-top:4px;line-height:1.35}.activity-text .meta{font-size:11px;color:var(--green);font-weight:750;margin-top:6px}.row-end{display:flex;align-items:center;gap:10px}.chev{color:#8a968e;font-size:16px}.choice{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}.choice button{border:0;background:transparent;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:800;color:var(--muted)}.choice button.selected{background:var(--green);color:#fff}.activity-details{border-top:1px solid var(--line);padding:18px;display:grid;grid-template-columns:180px 1fr;gap:18px}.media{min-height:164px;border-radius:14px;background:linear-gradient(145deg,#bfd6c0,#6f977e);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;overflow:hidden}.media .art{font-size:52px;filter:drop-shadow(0 5px 8px #0002)}.media span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}.detail-note{font-size:12px;color:var(--muted);margin:0 0 13px}.set-line{display:grid;grid-template-columns:54px 1fr 72px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #edf0eb;font-size:12px}.set-line b{font-size:12px}.set-line span{color:var(--muted)}.number-input,.time-input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;background:#fff}.card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.help{color:var(--muted);font-size:11px}.primary{border:0;border-radius:12px;background:var(--green);color:#fff;padding:11px 18px;font-weight:800;font-size:13px}.primary.lime{background:var(--lime);color:var(--ink)}.secondary{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 16px;color:var(--ink);font-weight:750;font-size:13px}.fab{position:fixed;left:max(calc((100vw - 1040px)/2 + 28px),28px);bottom:38px;width:58px;height:58px;border:0;border-radius:18px;background:var(--lime);box-shadow:0 12px 25px #66842944;font-size:30px;color:var(--ink);z-index:3}
    .toolbar{display:flex;align-items:center;gap:9px;margin:21px 0}.search{flex:1;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px;color:var(--ink);min-width:0}.list-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px 17px;display:flex;align-items:center;gap:13px;margin:10px 0}.list-card .body{flex:1;min-width:0}.list-card strong{display:block;font-size:14px}.list-card small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.mini-icon{height:42px;width:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}.ghost-link{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:800;padding:8px}.form{display:grid;gap:17px}.field label{display:block;font-size:11px;font-weight:850;color:#4f5c54;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;color:var(--ink)}.field textarea{min-height:74px;resize:vertical}.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.segmented{display:flex;gap:7px;flex-wrap:wrap}.segmented button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:750}.segmented button.active{background:var(--green);color:#fff;border-color:var(--green)}.upload{border:1.5px dashed #acc2ad;border-radius:16px;min-height:105px;background:#f7faf5;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:20px}.upload b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:20px;border-top:1px solid var(--line)}.weekday-row{display:flex;gap:6px;flex-wrap:wrap}.day-chip{height:35px;min-width:35px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:800}.day-chip.on{background:var(--green);border-color:var(--green);color:#fff}.hint-box{background:#f4f8ef;border:1px solid #ddebd5;color:#4b604f;border-radius:14px;padding:13px 15px;font-size:12px;line-height:1.5}
    .mission-hero{background:#e8f0df;border-radius:20px;padding:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:21px}.mission-hero h3{margin:0 0 6px;font-size:21px;letter-spacing:-.04em}.mission-hero p{font-size:12px;color:var(--muted);margin:0}.mission-hero .emoji{font-size:48px}.category-row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 2px}.category-row:last-child{border:0}.settings-group{border:1px solid var(--line);border-radius:17px;background:#fff;overflow:hidden;margin:16px 0 24px}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 18px;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting strong{display:block;font-size:13px}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.setting .right{font-size:12px;font-weight:800;color:var(--green);text-align:right}
    .overlay{position:absolute;inset:0;background:#14251b88;z-index:10}.drawer{position:absolute;top:0;bottom:0;left:0;width:min(320px,84%);background:var(--paper);padding:24px;box-shadow:20px 0 50px #10201333}.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.drawer-nav button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;border-radius:12px;text-align:left;padding:13px 12px;font-weight:750;color:var(--ink);margin:3px 0}.drawer-nav button:hover,.drawer-nav button.active{background:var(--soft)}.drawer-nav span{font-size:18px;width:23px}.drawer-footer{position:absolute;bottom:24px;left:24px;right:24px;border-top:1px solid var(--line);padding-top:19px;color:var(--muted);font-size:12px}.modal-wrap{position:absolute;inset:0;background:#14251b88;z-index:11;display:flex;align-items:center;justify-content:center;padding:18px}.modal{background:var(--paper);width:min(500px,100%);border-radius:23px;padding:23px;box-shadow:0 20px 70px #10201344}.modal-header{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:18px}.modal-header h3{margin:0;font-size:23px;letter-spacing:-.05em}.modal-option{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;margin:9px 0}.modal-option b{display:block;font-size:13px}.modal-option small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.modal-option .symbol{width:35px;height:35px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:19px}.modal-option .arrow{margin-left:auto;color:var(--muted)}.mock-alert{background:#eaf3e6;border-radius:11px;padding:11px 13px;font-size:12px;color:var(--green);margin-top:12px}
    .signin-layout{min-height:610px;display:grid;grid-template-columns:1fr 1fr;gap:0}.signin-visual{background:#213e2f;color:#fff;padding:38px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.signin-visual:after{content:"";position:absolute;width:360px;height:360px;border:60px solid #9cbe7666;border-radius:50%;right:-140px;bottom:45px}.signin-visual .large{font-size:47px;font-weight:900;line-height:1;letter-spacing:-.08em;max-width:420px;position:relative;z-index:1}.signin-visual small{color:#c4dcc7;position:relative;z-index:1}.signin-content{padding:45px;display:flex;flex-direction:column;justify-content:center}.signin-content h2{font-size:33px;letter-spacing:-.06em;margin:0}.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;font-weight:800;width:100%;margin-top:32px}.google-g{font-weight:900;color:#4285f4;font-size:19px}.signin-content .sub{max-width:330px}.signin-content .legal{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5}
    .screen-index{max-width:1040px;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:7px}.screen-index button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 10px;font-size:11px;color:var(--muted)}.screen-index button.active{background:var(--green);border-color:var(--green);color:#fff}
    @media(max-width:680px){.canvas{padding:0 0 88px}.intro{padding:18px 19px 13px;margin:0}.intro h1{font-size:18px}.intro p{font-size:11px}.intro .badge{display:none}.app{border:0;border-radius:0;min-height:calc(100vh - 90px);box-shadow:none}.topbar{padding:0 17px;height:65px}.top-right .brand{display:none}.top-right .sync{font-size:0}.top-right .sync-dot{height:9px;width:9px}.page{padding:24px 18px 105px}.page h2{font-size:28px}.summary{gap:6px}.stat{padding:12px 10px}.stat strong{font-size:19px}.stat span{font-size:10px}.activity-row{grid-template-columns:40px 34px 1fr auto;gap:7px;padding:12px 10px;min-height:82px}.time{font-size:10px}.cat-icon{width:33px;height:33px;font-size:17px}.activity-text strong{font-size:13px}.activity-text small{font-size:11px}.activity-text .meta{font-size:10px}.row-end{gap:5px}.choice button{padding:6px;font-size:10px}.activity-details{grid-template-columns:1fr}.media{min-height:145px}.fab{left:18px;bottom:20px}.field-grid{grid-template-columns:1fr}.signin-layout{display:block}.signin-visual{min-height:255px;padding:26px}.signin-visual .large{font-size:32px}.signin-content{padding:35px 25px 60px}.screen-index{padding:0 14px 25px;margin:0;background:var(--paper)}.screen-index button{font-size:10px}.date-btn{padding:9px 11px;font-size:12px}.icon-btn{width:38px;height:38px}}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="intro"><div><h1>Stride · screen mockups</h1><p>Clickable concept for the eight core screens, drawer, and date-only add flow</p></div><div class="badge">Design exploration · not connected to data</div></div>
    <div class="app" id="app">
      <header class="topbar" id="topbar"><div class="top-left"><button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button><button class="date-btn" id="dateBtn">Today · Thu 22 Oct ▾</button><input type="date" id="dateInput" value="2026-10-22" aria-label="Choose date" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div><div class="top-right"><div class="sync"><i class="sync-dot"></i> All changes synced</div><span class="brand">stride<span style="color:#83ad3c">.</span></span><span class="avatar">HS</span></div></header>
      <main id="content"></main>
      <button class="fab hidden" id="fab" title="Add activity to selected date" aria-label="Add activity to selected date">+</button>
      <div class="overlay hidden" id="drawerOverlay"><aside class="drawer"><div class="drawer-header"><span class="brand">stride<span style="color:#83ad3c">.</span></span><button class="icon-btn" id="closeDrawer" aria-label="Close menu">×</button></div><nav class="drawer-nav"><button data-screen="home"><span>⌂</span> Today</button><button data-screen="activities"><span>▤</span> Activities</button><button data-screen="missions"><span>▦</span> Missions</button><button data-screen="settings"><span>⚙</span> Settings</button><button id="analyticsNav"><span>◫</span> Analytics <small style="margin-left:auto;color:#839087">Later</small></button></nav><div class="drawer-footer">Signed in as<br><b style="color:#243a2c">you@example.com</b></div></aside></div>
      <div class="modal-wrap hidden" id="modalWrap"><div class="modal" id="modal"></div></div>
    </div>
    <div class="screen-index" id="screenIndex"></div>
  </div>
  <script>
    const screens=[['signin','Sign in'],['home','Home'],['activities','Activities'],['activityForm','Activity form'],['categories','Categories'],['missions','Missions'],['missionDetail','Mission detail'],['settings','Settings']];
    const state={screen:'home',date:'today',expanded:null,answer:null,done:false,modal:false,modalStep:'choose',method:'amount',scope:'weekdays',notice:''};
    const $=s=>document.querySelector(s);
    const page=(eyebrow,title,subtitle,body,action='')=>`<section class="page"><div class="page-title"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2><p class="sub">${subtitle}</p></div>${action}</div>${body}</section>`;
    const act=(id,time,emoji,name,desc,meta,end,details='')=>`<article class="activity ${state.expanded===id?'open':''}"><div class="activity-row" role="button" tabindex="0" data-expand="${id}"><span class="time">${time}</span><span class="cat-icon">${emoji}</span><div class="activity-text"><strong>${name}</strong><small>${desc}</small><div class="meta">${meta}</div></div><div class="row-end">${end}<span class="chev">${state.expanded===id?'⌃':'⌄'}</span></div></div>${state.expanded===id?details:''}</article>`;
    const media=(emoji,label)=>`<div class="media" role="img" aria-label="Illustrative media placeholder"><div class="art">${emoji}</div><span>${label} · media preview</span></div>`;
    function home(){let past=state.date==='past',future=state.date==='future';let title=past?'Tuesday, 20 October':future?'Saturday, 24 October':'Today, 22 October';let sub=past?'Locked · results cannot be changed':future?'Plan activities before their start time':'Your plan, in start-time order';let status=past?'<span class="pill neutral">🔒 Locked</span>':future?'<span class="pill">Upcoming</span>':'<span class="pill">● Day in progress</span>';
      let benchDetails=`<div class="activity-details">${media('🏋️','Bench press')}<div><p class="detail-note">Lower the bar with control, then press upward.</p>${[1,2,3].map((n)=>`<div class="set-line"><b>Set ${n}</b><span>Target ${[12,10,8][n-1]} reps</span><input class="number-input" type="number" min="0" placeholder="Actual" value="${past?([12,8,''][n-1]):(state.done&&n===1?'10':'')}" ${past?'disabled':''} aria-label="Actual reps for set ${n}"></div>`).join('')}<div class="card-actions"><span class="help">${past?'1 set unmarked · skipped':'Blank sets stay unmarked'}</span>${past?'':`<button class="primary" data-action="done">${state.done?'Update result':'Done'}</button>`}</div></div></div>`;
      let walkDetails=`<div class="activity-details">${media('🚶','Evening walk')}<div><p class="detail-note">Walk at a comfortable, steady pace.</p><div class="set-line"><b>Time</b><span>Target 00:30</span><input class="time-input" type="text" placeholder="hh:mm" value="${past?'00:25':''}" ${past?'disabled':''} aria-label="Actual duration"></div><div class="card-actions"><span class="help">Enter total duration</span>${past?'':`<button class="primary" data-action="done">Done</button>`}</div></div></div>`;
      let yesControl=`<div class="choice" aria-label="Yes or No"><button data-action="yes" class="${state.answer==='yes'?'selected':''}" ${past?'disabled':''}>Yes</button><button data-action="no" class="${state.answer==='no'?'selected':''}" ${past?'disabled':''}>No</button></div>`;
      let items=act('bench','07:00','💪','Bench press','Controlled bar path; steady tempo.','Gym mission · 3 sets · 12 / 10 / 8',`<span class="pill ${state.done?'':'neutral'}">${state.done?'Saved':'0 / 3'}</span>`,benchDetails)+act('stretch','07:45','🧘','Shoulder mobility','Slow circles and gentle range of motion.','Gym mission · target 00:10','<span class="pill neutral">Pending</span>',`<div class="activity-details">${media('🧘','Shoulder mobility')}<div><p class="detail-note">Slow circles and gentle range of motion.</p><div class="set-line"><b>Time</b><span>Target 00:10</span><input class="time-input" placeholder="hh:mm"></div><div class="card-actions"><span class="help">Record actual time</span><button class="primary" data-action="done">Done</button></div></div></div>`)+act('supp','09:00','🏋️','Take supplements','After breakfast with water.','Daily essentials · Yes / No',yesControl,`<div class="activity-details">${media('💊','Supplements')}<p class="detail-note">After breakfast with water. Use the Yes / No control in the row.</p></div>`)+act('walk','18:30','🏃','Evening walk','Walk at a comfortable, steady pace.','Target 00:30 · no Mission','<span class="pill neutral">Pending</span>',walkDetails);
      return page('Your day',title,sub,`<div class="summary"><div class="stat"><strong>04</strong><span>Planned</span></div><div class="stat"><strong>${state.done?'01':'00'}</strong><span>Recorded</span></div><div class="stat"><strong>18:30</strong><span>Last start</span></div></div><div class="section-label"><span>Timeline</span><span>${status}</span></div>${items}<div class="hint-box" style="margin-top:18px">${past?'This date is locked. Blank results are shown as skipped.':'Plan details can change before each activity starts. Results can be corrected until midnight.'}</div>`);
    }
    function activities(){let cards=[['💪','Bench press','3 sets · 12 / 10 / 8 reps','Gym mission'],['🧘','Shoulder mobility','Target 00:10 · duration','Gym mission'],['🏋️','Take supplements','Yes / No','Daily essentials'],['🏃','Evening walk','Target 00:30 · duration','No Mission']].map(x=>`<div class="list-card"><span class="mini-icon">${x[0]}</span><span class="body"><strong>${x[1]}</strong><small>${x[2]} · ${x[3]}</small></span><button class="ghost-link" data-screen="activityForm">Edit →</button></div>`).join('');return page('Library','Activities','Define reusable activities, targets, media, and schedules.',`<div class="toolbar"><input class="search" placeholder="Search activities" aria-label="Search activities"><button class="secondary" data-screen="categories">Emoji categories</button></div><div class="section-label"><span>Active activities</span><span>4 total</span></div>${cards}<div class="hint-box" style="margin-top:20px">Activities created through Home + live only on their selected date and do not appear in this library.</div>`,`<button class="primary" data-screen="activityForm">+ New activity</button>`)}
    function activityForm(){return page('Activities / new','Create activity','A concrete action with its own target and required image or GIF.',`<div class="form"><div class="field-grid"><div class="field"><label>Activity name</label><input value="Bench press"></div><div class="field"><label>Category</label><select><option>💪 Strength</option><option>🏃 Cardio</option><option>🧘 Mobility</option></select></div></div><div class="field"><label>One-line description</label><input value="Controlled bar path; steady tempo."></div><div class="field"><label>Mission · optional</label><select><option>Gym mission</option><option>Daily essentials</option><option>None</option></select></div><div class="field"><label>Image or GIF · required</label><div class="upload"><div>▧<b>Choose an image or GIF</b>Required before saving</div></div></div><div class="field"><label>Tracking method</label><div class="segmented"><button class="${state.method==='amount'?'active':''}" data-method="amount">Amount / target</button><button class="${state.method==='duration'?'active':''}" data-method="duration">Duration</button><button class="${state.method==='yesno'?'active':''}" data-method="yesno">Yes / No</button></div></div>${state.method==='amount'?`<div class="field"><label>Targets · at least one required</label><div class="set-line"><b>Set 1</b><span>reps</span><input class="number-input" value="12"></div><div class="set-line"><b>Set 2</b><span>reps</span><input class="number-input" value="10"></div><div class="set-line"><b>Set 3</b><span>reps</span><input class="number-input" value="8"></div><button class="ghost-link">+ Add set</button></div>`:state.method==='duration'?`<div class="field"><label>Target duration · hh:mm</label><input value="00:30"></div>`:`<div class="hint-box">The user will answer Yes or No on the Home row.</div>`}<div class="field"><label>Schedule</label><div class="segmented"><button class="${state.scope==='weekdays'?'active':''}" data-scope="weekdays">Weekdays</button><button class="${state.scope==='date'?'active':''}" data-scope="date">One date</button></div></div>${state.scope==='weekdays'?`<div class="field-grid"><div class="field"><label>Select weekdays</label><div class="weekday-row">${['M','T','W','T','F','S','S'].map((d,i)=>`<button class="day-chip ${[0,2,4].includes(i)?'on':''}">${d}</button>`).join('')}</div></div><div class="field"><label>Shared start time</label><input type="time" value="07:00"></div></div>`:`<div class="field-grid"><div class="field"><label>Date</label><input type="date" value="2026-10-24"></div><div class="field"><label>Start time</label><input type="time" value="07:00"></div></div>`}<div class="form-footer"><button class="ghost-link" data-screen="activities">← Back</button><button class="primary" data-action="mockSave">Save activity</button></div></div>`)}
    function categories(){return page('Activities / categories','Category legend','Edit the emoji labels used on activities. Starter choices are fully editable.',`<div class="settings-group">${[['💪','Strength'],['🏃','Cardio'],['🧘','Mobility'],['🏋️','Other']].map(x=>`<div class="category-row"><span class="mini-icon">${x[0]}</span><strong>${x[1]}</strong><button class="ghost-link" data-action="mockEdit">Edit</button></div>`).join('')}</div><div class="hint-box">Category is a field on each activity. This legend supplies the choices for that field.</div>`,`<button class="primary" data-action="mockEdit">+ Category</button>`)}
    function missions(){return page('Group activities','Missions','Missions organize activities. The date and time belong to each activity’s schedule.',`<div class="mission-hero"><div><p class="eyebrow">Mission</p><h3>Gym mission</h3><p>2 activities · reusable group</p></div><span class="emoji">🏋️</span></div><div class="list-card"><span class="mini-icon">☀️</span><span class="body"><strong>Daily essentials</strong><small>1 activity · reusable group</small></span><button class="ghost-link" data-screen="missionDetail">Open →</button></div><div class="hint-box" style="margin-top:22px">Activities without a Mission are still scheduled and appear in Home by start time.</div>`,`<button class="primary" data-action="mockEdit">+ New Mission</button>`)}
    function missionDetail(){return page('Missions','Gym mission','A group of activities. Each activity keeps its own schedule and start time.',`<div class="mission-hero"><div><p class="eyebrow">Reusable group</p><h3>Gym mission</h3><p>2 activities linked</p></div><span class="emoji">🏋️</span></div><div class="section-label"><span>Activities in this Mission</span><span>2 total</span></div><div class="list-card"><span class="mini-icon">💪</span><span class="body"><strong>Bench press</strong><small>Mon · Wed · Fri, 07:00 · 3 sets</small></span><button class="ghost-link" data-screen="activityForm">Edit →</button></div><div class="list-card"><span class="mini-icon">🧘</span><span class="body"><strong>Shoulder mobility</strong><small>Mon · Wed · Fri, 07:45 · 00:10 target</small></span><button class="ghost-link" data-screen="activityForm">Edit →</button></div><div class="hint-box" style="margin-top:20px">Changing this group does not change an activity’s schedule. Open the activity to edit its date or weekdays.</div>`,`<button class="secondary" data-action="mockEdit">Edit Mission</button>`)}
    function settings(){return page('Your account','Settings','One tracker time zone and clear control over syncing.',`<div class="section-label"><span>Account</span></div><div class="settings-group"><div class="setting"><div><strong>Google account</strong><small>Used to sign in on phone and laptop</small></div><span class="right">you@example.com</span></div><div class="setting"><div><strong>Storage</strong><small>Activities and results in Supabase</small></div><span class="right">Connected</span></div></div><div class="section-label"><span>Preferences</span></div><div class="settings-group"><div class="setting"><div><strong>Tracker time zone</strong><small>Applies to all dates and records</small></div><span class="right">Asia/Kolkata ▾</span></div><div class="setting"><div><strong>Offline data</strong><small>Cached plan is ready on this device</small></div><span class="right">Ready</span></div><div class="setting"><div><strong>Sync status</strong><small>Pending changes clear after sync</small></div><span class="right">● All synced</span></div></div><button class="secondary" data-screen="signin">Sign out</button>`)}
    function signin(){return `<div class="signin-layout"><div class="signin-visual"><span class="brand">stride<span style="color:var(--lime)">.</span></span><div class="large">Keep showing up.<br>See what you did.</div><small>Plans, sets, time and honest progress in one calm place.</small></div><div class="signin-content"><p class="eyebrow">Welcome</p><h2>Your routine,<br>ready when you are.</h2><p class="sub">A simple tracker for your workouts and everyday activities. Your plan stays available offline and syncs when you reconnect.</p><button class="google-btn" data-screen="home"><span class="google-g">G</span> Continue with Google</button><p class="legal">Design mockup. Sign-in is not connected yet.</p></div></div>`}
    function render(){const content={signin,home,activities,activityForm,categories,missions,missionDetail,settings};$('#content').innerHTML=content[state.screen]();$('#topbar').classList.toggle('hidden',state.screen==='signin');$('#fab').classList.toggle('hidden',state.screen!=='home'||state.date==='past');$('#dateBtn').textContent=state.date==='today'?'Today · Thu 22 Oct ▾':state.date==='past'?'Tue 20 Oct ▾':'Sat 24 Oct ▾';$('#screenIndex').innerHTML=screens.map(([key,label])=>`<button data-screen="${key}" class="${state.screen===key?'active':''}">${label}</button>`).join('');document.querySelectorAll('.drawer-nav [data-screen]').forEach(el=>el.classList.toggle('active',el.dataset.screen===state.screen));}
    function showModal(step='choose'){state.modalStep=step;$('#modalWrap').classList.remove('hidden');let body=step==='choose'?`<button class="modal-option" data-modal-step="existing"><span class="symbol">▤</span><span><b>Choose existing activity</b><small>Add a reusable activity to this date only</small></span><span class="arrow">→</span></button><button class="modal-option" data-modal-step="new"><span class="symbol">＋</span><span><b>Create new activity</b><small>Stored only on this date; not in the library</small></span><span class="arrow">→</span></button>`:step==='existing'?`<div class="field"><label>Select activity</label><select><option>Bench press</option><option>Evening walk</option><option>Shoulder mobility</option></select></div><div class="field-grid" style="margin-top:14px"><div class="field"><label>Selected date</label><input value="${state.date==='future'?'24 Oct 2026':'22 Oct 2026'}" disabled></div><div class="field"><label>Start time</label><input type="time" value="19:00"></div></div><div class="mock-alert">This adds one dated record. The reusable activity stays unchanged.</div><div style="display:flex;justify-content:space-between;margin-top:22px"><button class="secondary" data-modal-step="choose">Back</button><button class="primary" data-action="addMock">Add to date</button></div>`:`<div class="field-grid"><div class="field"><label>Name</label><input placeholder="e.g. Walk 5 km"></div><div class="field"><label>Start time</label><input type="time" value="19:00"></div></div><div class="field-grid" style="margin-top:13px"><div class="field"><label>Category</label><select><option>🏃 Cardio</option><option>💪 Strength</option><option>🧘 Mobility</option></select></div><div class="field"><label>Mission · optional</label><select><option>None</option><option>Gym mission</option><option>Daily essentials</option></select></div></div><div class="field" style="margin-top:13px"><label>One-line description</label><input placeholder="Short description"></div><div class="field" style="margin-top:13px"><label>Required image or GIF</label><div class="upload">▧ &nbsp; Choose media</div></div><div class="field" style="margin-top:13px"><label>Tracking method and target</label><select><option>Amount / target · 5 km</option><option>Duration · hh:mm</option><option>Yes / No</option></select></div><div class="mock-alert">This activity will exist only on the selected date.</div><div style="display:flex;justify-content:space-between;margin-top:22px"><button class="secondary" data-modal-step="choose">Back</button><button class="primary" data-action="addMock">Add to date</button></div>`;$('#modal').innerHTML=`<div class="modal-header"><div><p class="eyebrow">${state.date==='future'?'Saturday, 24 October':'Today, 22 October'}</p><h3>${step==='choose'?'Add activity':step==='existing'?'Choose activity':'New date-only activity'}</h3></div><button class="icon-btn" data-action="closeModal" aria-label="Close modal">×</button></div>${body}`}
    document.addEventListener('click',e=>{let t=e.target.closest('[data-screen],[data-expand],[data-method],[data-scope],[data-action],[data-modal-step],.day-chip');if(!t)return;if(t.dataset.screen){state.screen=t.dataset.screen;$('#drawerOverlay').classList.add('hidden');render();return}if(t.dataset.expand){if(e.target.closest('.choice'))return;state.expanded=state.expanded===t.dataset.expand?null:t.dataset.expand;render();return}if(t.dataset.method){state.method=t.dataset.method;render();return}if(t.dataset.scope){state.scope=t.dataset.scope;render();return}if(t.dataset.modalStep){showModal(t.dataset.modalStep);return}if(t.classList.contains('day-chip')){t.classList.toggle('on');return}let a=t.dataset.action;if(a==='yes'||a==='no'){state.answer=a;render()}if(a==='done'){state.done=true;render()}if(a==='closeModal')$('#modalWrap').classList.add('hidden');if(a==='addMock'){state.notice='Added to this date';$('#modalWrap').classList.add('hidden');alert('Mockup: activity added to the selected date. No data was saved.')}if(a==='mockSave'||a==='mockEdit')alert('Design mockup only — this control shows the intended action.');});
    $('#menuBtn').addEventListener('click',()=>$('#drawerOverlay').classList.remove('hidden'));$('#closeDrawer').addEventListener('click',()=>$('#drawerOverlay').classList.add('hidden'));$('#drawerOverlay').addEventListener('click',e=>{if(e.target.id==='drawerOverlay')e.target.classList.add('hidden')});$('#fab').addEventListener('click',()=>showModal());$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')e.target.classList.add('hidden')});$('#dateBtn').addEventListener('click',()=>{const picker=$('#dateInput');if(picker.showPicker)picker.showPicker();else picker.click()});$('#dateInput').addEventListener('change',e=>{const value=e.target.value;state.date=value<'2026-10-22'?'past':value>'2026-10-22'?'future':'today';state.expanded=null;render()});$('#analyticsNav').addEventListener('click',()=>alert('Analytics will be designed in a later phase.'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drawerOverlay').classList.add('hidden');$('#modalWrap').classList.add('hidden')}if((e.key==='Enter'||e.key===' ')&&e.target.dataset.expand){e.preventDefault();e.target.click()}});render();
  </script>
